# Section 4.10 fault tolerance demo: load-balances across the three GymFlow
# instances defined in docker-compose.yml and fails over automatically when
# one of them stops responding. See docs/FAULT_TOLERANCE_DEMO.md.
events {
    worker_connections 1024;
}

http {
    # Passive health checking (the mechanism available in open-source
    # nginx, no paid module needed): after `max_fails` failed attempts
    # within `fail_timeout`, a backend is taken out of rotation for that
    # same window and automatically re-tried afterwards.
    upstream gymflow_backend {
        server app1:5000 max_fails=1 fail_timeout=10s;
        server app2:5000 max_fails=1 fail_timeout=10s;
        server app3:5000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gymflow_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # If the backend nginx just picked is down or times out mid
            # request, silently retry the SAME request against another
            # healthy backend instead of showing the visitor an error --
            # this is the actual "one instance dies, the site keeps
            # running" behaviour, not just the health check.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;
        }
    }
}
