{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Notifications — GymFlow{% endblock %}
{% block content %}
<div class="card-panel" style="max-width:480px;">
  <div class="page-title"><div class="icon-badge">{{ icon('bell', 18) }}</div><h1>Notification settings</h1></div>
  <p class="muted">Use case 3.5.10 — Notification settings.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label><input type="radio" name="mode" value="email" {% if user.notifications_enabled %}checked{% endif %}> Email me about card and booking updates</label>
    </div>
    <div class="form-group">
      <label><input type="radio" name="mode" value="none" {% if not user.notifications_enabled %}checked{% endif %}> Do not notify me</label>
    </div>
    <button class="btn" type="submit">Save preference</button>
  </form>
</div>
{% endblock %}
