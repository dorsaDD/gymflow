{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Password recovery — GymFlow{% endblock %}
{% block content %}
<div class="card-panel" style="max-width:420px; margin: 2rem auto;">
  <div class="page-title"><div class="icon-badge">{{ icon('key', 18) }}</div><h1>Password recovery</h1></div>
  <p class="muted">Enter the email address you registered with. We'll send a temporary password to it.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required autofocus>
    </div>
    <button class="btn" type="submit">Send temporary password</button>
    <a class="btn secondary" href="{{ url_for('auth.login') }}">Back to login</a>
  </form>
</div>
{% endblock %}
