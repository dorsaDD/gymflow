{% extends "base.html" %}
{% block title %}Register member — GymFlow{% endblock %}
{% block content %}
<div class="card-panel" style="max-width:640px;">
  <h1>Register a new member</h1>
  <p class="muted">Use case 3.5.3 — Member registration and card creation.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="two-col">
      <div class="form-group"><label>Name</label><input type="text" name="name" required></div>
      <div class="form-group"><label>Surname</label><input type="text" name="surname" required></div>
    </div>
    <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
    <div class="two-col">
      <div class="form-group"><label>Birthdate</label><input type="date" name="birthdate" required></div>
      <div class="form-group">
        <label>Sex</label>
        <select name="sex" required>
          <option value="">Select…</option>
          <option value="F">Female</option>
          <option value="M">Male</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label>Address</label><input type="text" name="address" required></div>
    <div class="form-group"><label>Phone</label><input type="tel" name="phone" required></div>
    <button class="btn" type="submit">Register member</button>
  </form>
</div>
{% endblock %}
