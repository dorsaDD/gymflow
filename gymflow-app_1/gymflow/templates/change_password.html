{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Change password — GymFlow{% endblock %}
{% block content %}
<div class="card-panel" style="max-width:420px; margin: 2rem auto;">
  <div class="page-title"><div class="icon-badge">{{ icon('key', 18) }}</div><h1>Change password</h1></div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>New password (min. 8 characters)</label>
      <input type="password" name="new_password" minlength="8" required autofocus>
    </div>
    <div class="form-group">
      <label>Confirm new password</label>
      <input type="password" name="confirm_password" minlength="8" required>
    </div>
    <button class="btn" type="submit">Change password</button>
  </form>
</div>
{% endblock %}
